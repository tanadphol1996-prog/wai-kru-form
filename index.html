<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบบันทึกข้อมูลพิธีไหว้ครู 2569..</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --purple-primary: #6d28d9;
            --purple-hover: #5b21b6;
            --orange-primary: #f97316;
            --orange-hover: #ea580c;
            --bg-gradient: linear-gradient(135deg, #f5f3ff 0%, #fff7ed 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            max-width: 650px;
            width: 100%;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(109, 40, 217, 0.1);
            position: relative;
            overflow: hidden;
        }

        .form-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--purple-primary), var(--orange-primary));
        }

        .form-header { text-align: center; margin-bottom: 30px; }
        .form-header i { font-size: 52px; color: var(--purple-primary); margin-bottom: 12px; }
        .form-header h2 { color: #1e293b; font-size: 26px; font-weight: 600; }
        .form-header p { color: #64748b; font-size: 14px; margin-top: 6px; }

        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; margin-bottom: 8px; color: #334155; font-weight: 500; font-size: 15px; }
        .form-group label i { margin-right: 6px; color: var(--purple-primary); }
        .label-desc { font-weight: 300; font-size: 13px; color: #64748b; margin-top: 2px; }

        .input-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            color: #1e293b;
            transition: all 0.3s ease;
            background: #ffffff;
        }

        .input-control:focus {
            outline: none;
            border-color: var(--purple-primary);
            box-shadow: 0 0 0 4px rgba(109, 40, 217, 0.1);
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        textarea.input-control { resize: vertical; min-height: 75px; }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--purple-primary) 0%, #4c1d95 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(109, 40, 217, 0.2);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(109, 40, 217, 0.3);
            background: linear-gradient(135deg, var(--purple-hover) 0%, #3b0764 100%);
        }

        .btn-submit:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; box-shadow: none; }
        .orange-accent { color: var(--orange-primary) !important; }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <i class="fa-solid fa-hands-bound"></i>
            <h2>แบบบันทึกข้อมูล<span style="color: var(--orange-primary)">พิธีไหว้ครู 2569</span></h2>
            <p>ระบบบันทึกข้อมูลอำนวยความสะดวกเชื่อมต่อ Google Sheets</p>
        </div>

        <form id="registrationForm">
            <div class="grid-2">
                <div class="form-group">
                    <label><i class="fa-solid fa-layer-group"></i> ระดับชั้น</label>
                    <select name="level" class="input-control" required>
                        <option value="" disabled selected>เลือกชั้นปี...</option>
                        <option value="ม.1">มัธยมศึกษาปีที่ 1</option>
                        <option value="ม.2">มัธยมศึกษาปีที่ 2</option>
                        <option value="ม.3">มัธยมศึกษาปีที่ 3</option>
                        <option value="ม.4">มัธยมศึกษาปีที่ 4</option>
                        <option value="ม.5">มัธยมศึกษาปีที่ 5</option>
                        <option value="ม.6">มัธยมศึกษาปีที่ 6</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-door-open"></i> ห้อง</label>
                    <input type="text" name="room" class="input-control" placeholder="เช่น 1, 2/1" required>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-user-tie"></i> ครูที่ปรึกษา</label>
                <input type="text" name="advisor" class="input-control" placeholder="ระบุชื่อ - นามสกุล ครูที่ปรึกษา" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-mars"></i> ชื่อ - สกุล นักเรียนถือพาน (ชาย)</label>
                <input type="text" name="boys" class="input-control" placeholder="ระบุชื่อ - นามสกุล" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-venus orange-accent"></i> ชื่อ - สกุล นักเรียนถือพาน (หญิง)</label>
                <input type="text" name="girls" class="input-control" placeholder="ระบุชื่อ - นามสกุล" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-users orange-accent"></i> นักเรียนผู้ทำพาน (ไม่เกิน 8 คน)</label>
                <textarea name="creators" class="input-control" placeholder="รูปแบบ: นายแดง แดงดี / นางสาวฟ้า ฟ้าดี / ..." required></textarea>
                <div class="label-desc">คั่นชื่อแต่ละคนด้วยเครื่องหมายสแลช ( / ) ตามรูปแบบหัวตาราง</div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fa-solid fa-cloud-arrow-up"></i> บันทึกข้อมูลลงระบบ
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // นำ URL Web App ที่ได้จากการ Deploy ใหม่มาวางในช่องว่างด้านล่างนี้ครับ
        const scriptURL = 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnTz4h0kx2ah1B30oKNzP0kA6g_CXkCtHzmbX4-9VvZERqsCsPS7aZHYuZMkev7Ua_vPjrFMtIR3wvN9QmrizW3k6l3B0Hzuv9QlNcIAsOvypPBD5z_lQCnLroLdp27ZYZ0V3ekpKIjuxFcI9RKjClUzyXlQqDnhJmyAL1hEntYI_Wqb0fXmD-y01HSW9HeRdTFfko6s5zMIgepsaezgGHFqvavW1FyYfu4opB9FmTfAuVlpnOjLfHjhfj7dfGJkHln2Fc6iAOAZ55UySIkgSV8g-CuhxQ&lib=MVKvU75HfhevGtdMx47ccVGiV--gnmX7J'; 
        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังส่งข้อมูลเข้า Google Sheets...';

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => response.json())
                .then(data => {
                    if(data.result === 'success') {
                        Swal.fire({
                            icon: 'success',
                            title: 'บันทึกสำเร็จ!',
                            text: 'ข้อมูลถูกส่งเข้าไฟล์แบบบันทึกข้อมูลพิธีไหว้ครูเรียบร้อยแล้ว',
                            confirmButtonColor: '#6d28d9'
                        });
                        form.reset();
                    } else {
                        throw new Error(data.message);
                    }
                })
                .catch(error => {
                    Swal.fire({
                        icon: 'error',
                        title: 'เกิดข้อผิดพลาด!',
                        text: 'ไม่สามารถบันทึกได้เนื่องจาก: ' + error.message,
                        confirmButtonColor: '#f97316'
                    });
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> บันทึกข้อมูลลงระบบ';
                });
        });
    </script>
</body>
</html>
